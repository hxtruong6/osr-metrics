[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osr-metrics"
version = "0.3.0"
description = "Open-Set Recognition (OSR) and OOD-detection metrics for ML research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "truong dev", email = "hxtruong6ac@gmail.com" }
]
keywords = ["open-set-recognition", "ood-detection", "metrics", "auroc", "aoscr", "delong", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "tomli>=2; python_version<'3.11'",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hxtruong6/osr-metrics"
Repository = "https://github.com/hxtruong6/osr-metrics"
Issues = "https://github.com/hxtruong6/osr-metrics/issues"
Changelog = "https://github.com/hxtruong6/osr-metrics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["osr_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
files = ["osr_metrics"]
# Practical config: catches real bugs (Optional misuse, undefined names,
# return type mismatches) without forcing NDArray[float64] everywhere.
# Tighten incrementally — see CHANGELOG roadmap.
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_generics = false  # numpy ndarray uses Any internals; allow

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
