[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osr-metrics"
version = "0.1.1"
description = "Open-Set Recognition (OSR) and OOD-detection metrics for ML research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "truong dev" }
]
keywords = ["open-set-recognition", "ood-detection", "metrics", "auroc", "aoscr", "delong", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Repository = "https://github.com/yourname/osr-metrics-py"

[tool.setuptools.packages.find]
where = ["."]
include = ["osr_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
